# The one-time code (providers/EmailCode.java). The other emails use Keycloak's English texts.
fcEmailCodeLoginSubject=Your code to sign in to {0}
fcEmailCodeLoginIntro=Enter this code to sign in to your {0} account:
fcEmailCodeLoginOutro=It works for {0} minutes. If you aren''t signing in, ignore this email: nobody can sign in without the code.
fcEmailCodeSecondSubject=Your {0} verification code
fcEmailCodeSecondIntro=Someone entered the password of your {0} account. If it was you, enter this code to finish signing in:
fcEmailCodeSecondOutro=It works for {0} minutes. If it wasn''t you, someone knows your password: change it with “Forgot password?”.
fcEmailCodeSetupSubject=Turn on email codes for {0}
fcEmailCodeSetupIntro=To get your {0} two-step codes at this email, enter this code:
fcEmailCodeSetupOutro=It works for {0} minutes. If you didn''t ask for it, ignore this email: nothing will change.
eventRemoveCredentialSubject=Sign-in to your account changed
fcEventForgetTrustedDevicesBody=Your trusted devices were forgotten on {0} from {1}: signing in on any of them will ask for the second step again. If this wasn't you, review your account right away.
fcEventForgetTrustedDevicesBodyHtml=<p>Your trusted devices were forgotten on {0} from {1}: signing in on any of them will ask for the second step again.</p><p>If this wasn't you, review your account right away.</p>
# The required actions of our realm that Keycloak's English doesn't name.
requiredAction.UPDATE_EMAIL=Update Email
requiredAction.webauthn-register=Add a Passkey
requiredAction.webauthn-register-passwordless=Add a Passkey
requiredAction.fc-configure-email-code=Turn On Email Codes
requiredAction.delete_account=Delete Account
