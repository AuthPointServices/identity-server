# Los clientes OIDC del realm, todos en este archivo: keycloak-config-cli gestiona cada tipo desde un solo lugar.
# En la Cuenta, cada producto sale así:
#   - en la lista de productos: enabled y alwaysDisplayInConsole («Always display in UI»), con su logoUri;
#   - en desarrollo: enabled sin alwaysDisplayInConsole; funciona y sus sesiones salen en la Cuenta;
#   - oculto del todo: atributo fc.hidden "true"; funciona, pero la Cuenta no lo nombra en ningún sitio;
#   - apagado: enabled false.
# La Cuenta tarda hasta un minuto en verlo (accounts-backend guarda la lista ese tiempo).
realm: $(env:REALM)
clients:
  # La Cuenta (accounts-backend). Es un BFF: guarda los tokens en el servidor y el navegador sólo ve su cookie.
  # Con el token de la persona usa la API de cuenta (perfil, sesiones, factores); su cuenta de servicio sólo lee
  # eventos, para la actividad reciente.
  - clientId: accounts
    name: $(env:BRAND_NAME) · Cuenta
    enabled: true
    protocol: openid-connect
    publicClient: false
    clientAuthenticatorType: client-secret
    secret: $(env:ACCOUNTS_CLIENT_SECRET)
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: true
    consentRequired: false
    frontchannelLogout: false
    rootUrl: $(env:ACCOUNTS_URL)
    baseUrl: /
    redirectUris: [/auth/callback]
    webOrigins: []
    # Sólo los roles que se le asignan abajo, no todos los de la persona. La API de administración (desde 26.8.2)
    # exige el scope kc-admin-api: es opcional y la cuenta de servicio lo pide sólo cuando la llama.
    fullScopeAllowed: false
    defaultClientScopes: [basic, acr, profile, email, roles]
    optionalClientScopes: [kc-admin-api]
    attributes:
      pkce.code.challenge.method: S256
      post.logout.redirect.uris: /*
      backchannel.logout.url: $(env:ACCOUNTS_BACKCHANNEL_URL)
      backchannel.logout.session.required: "true"
      backchannel.logout.revoke.offline.tokens: "true"

  # Orange: entra por redirección con auth-go, como la Cuenta, y su backend guarda los tokens. Sin cuenta de servicio:
  # no habla con Keycloak más que para iniciar y cerrar sesión.
  - clientId: orange
    name: $(env:BRAND_NAME) · Orange
    enabled: true
    alwaysDisplayInConsole: true
    protocol: openid-connect
    publicClient: false
    clientAuthenticatorType: client-secret
    secret: $(env:ORANGE_CLIENT_SECRET)
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    consentRequired: false
    frontchannelLogout: false
    rootUrl: $(env:ORANGE_URL)
    baseUrl: /
    redirectUris: [/auth/callback]
    webOrigins: []
    fullScopeAllowed: false
    defaultClientScopes: [basic, acr, profile, email]
    attributes:
      logoUri: $(env:ACCOUNTS_URL)/products/orange.svg
      pkce.code.challenge.method: S256
      post.logout.redirect.uris: /*
      backchannel.logout.url: $(env:ORANGE_BACKCHANNEL_URL)
      backchannel.logout.session.required: "true"
      backchannel.logout.revoke.offline.tokens: "true"

  # letgrid: entra por redirección con auth-go, como la Cuenta, y su backend guarda los tokens. Sin cuenta de servicio:
  # no habla con Keycloak más que para iniciar y cerrar sesión.
  - clientId: letgrid
    name: $(env:BRAND_NAME) · letgrid
    enabled: true
    alwaysDisplayInConsole: true
    protocol: openid-connect
    publicClient: false
    clientAuthenticatorType: client-secret
    secret: $(env:LETGRID_CLIENT_SECRET)
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    consentRequired: false
    frontchannelLogout: false
    rootUrl: $(env:LETGRID_URL)
    baseUrl: /
    redirectUris: [/auth/callback]
    webOrigins: []
    fullScopeAllowed: false
    defaultClientScopes: [basic, acr, profile, email]
    attributes:
      logoUri: $(env:ACCOUNTS_URL)/products/letgrid.svg
      pkce.code.challenge.method: S256
      post.logout.redirect.uris: /*
      backchannel.logout.url: $(env:LETGRID_BACKCHANNEL_URL)
      backchannel.logout.session.required: "true"
      backchannel.logout.revoke.offline.tokens: "true"

  # La consola de cuenta de Keycloak no se usa: la Cuenta es accounts-frontend. Los enlaces «a tu cuenta» de Keycloak
  # van a la nuestra, y la API de cuenta (cliente account) sigue, porque es la que usa accounts-backend.
  - clientId: account-console
    enabled: false
  - clientId: account
    rootUrl: $(env:ACCOUNTS_URL)
    baseUrl: /

users:
  - username: service-account-accounts
    enabled: true
    serviceAccountClientId: accounts
    clientRoles:
      # Sólo leer: los eventos para la actividad y los clientes para los productos (el secreto llega enmascarado).
      realm-management: [view-events, view-clients]

clientScopeMappings:
  account:
    - client: accounts
      roles: [manage-account, view-profile]
  realm-management:
    - client: accounts
      roles: [view-events, view-clients]
