# El realm de todas las cuentas de la empresa. Las variables salen del entorno; ver .env.example.
realm: $(env:REALM)
enabled: true
displayName: $(env:BRAND_NAME)

# Cualquiera crea su cuenta, entra con el correo y lo verifica antes de usarla.
registrationAllowed: true
registrationEmailAsUsername: true
loginWithEmailAllowed: true
duplicateEmailsAllowed: false
editUsernameAllowed: false
verifyEmail: true
resetPasswordAllowed: true
rememberMe: true

internationalizationEnabled: true
supportedLocales: [es, en]
defaultLocale: es
sslRequired: external

# Contraseñas largas antes que raras (NIST 800-63B); el hash es Argon2, el de Keycloak por defecto.
passwordPolicy: length(12) and maxLength(128) and notUsername and notEmail and passwordHistory(3)

# Tras 10 fallos seguidos la cuenta espera, cada vez más (hasta 15 min); nunca queda bloqueada para siempre.
bruteForceProtected: true
permanentLockout: false
failureFactor: 10
waitIncrementSeconds: 60
maxFailureWaitSeconds: 900
maxDeltaTimeSeconds: 43200
quickLoginCheckMilliSeconds: 1000
minimumQuickLoginWaitSeconds: 60

# Sesiones como en Google: un día sin uso, o un mes con «Recordarme»; el token de acceso dura 5 min y cada
# refresh token sirve una sola vez.
accessTokenLifespan: 300
ssoSessionIdleTimeout: 86400
ssoSessionMaxLifespan: 864000
ssoSessionIdleTimeoutRememberMe: 2592000
ssoSessionMaxLifespanRememberMe: 7776000
revokeRefreshToken: true
refreshTokenMaxReuse: 0

# Lo que hace cada cuenta (entradas, cambios, fallos) y cada administrador, 90 días: de aquí sale la actividad
# reciente de la cuenta y la auditoría.
eventsEnabled: true
eventsExpiration: 7776000
adminEventsEnabled: true
adminEventsDetailsEnabled: true

# Passkeys: se ofrecen en el mismo formulario del correo. El RP ID es el dominio de la empresa, así una passkey
# vale en auth. y en accounts. aunque el producto viva en otro dominio.
webAuthnPolicyPasswordlessRpEntityName: $(env:BRAND_NAME)
webAuthnPolicyPasswordlessRpId: $(env:PASSKEY_RP_ID)
webAuthnPolicyPasswordlessPasskeysEnabled: true
webAuthnPolicyRpEntityName: $(env:BRAND_NAME)
webAuthnPolicyRpId: $(env:PASSKEY_RP_ID)

# El correo de verificar y recuperar sale de aquí, con el nombre de la marca.
smtpServer:
  host: $(env:SMTP_HOST)
  port: $(env:SMTP_PORT)
  from: $(env:SMTP_FROM)
  fromDisplayName: $(env:BRAND_NAME)
  starttls: $(env:SMTP_STARTTLS)
  auth: $(env:SMTP_AUTH)
  user: $(env:SMTP_USER)
  password: $(env:SMTP_PASSWORD)
