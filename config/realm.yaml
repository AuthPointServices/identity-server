# El realm de todas las cuentas de la empresa. Las variables salen del entorno; ver .env.example.
realm: $(env:REALM)
enabled: true
displayName: $(env:BRAND_NAME)

# Cualquiera crea su cuenta, entra con el correo y lo verifica antes de usarla.
registrationAllowed: true
registrationEmailAsUsername: true
loginWithEmailAllowed: true
duplicateEmailsAllowed: false
editUsernameAllowed: false
verifyEmail: true
resetPasswordAllowed: true
rememberMe: true

# Las pantallas de acceso y los correos con la identidad de la Cuenta (themes/fretchcop).
loginTheme: fretchcop
emailTheme: fretchcop

internationalizationEnabled: true
supportedLocales: [es, en]
defaultLocale: es
sslRequired: external

# Contraseñas largas antes que raras (NIST 800-63B); el hash es Argon2, el de Keycloak por defecto.
passwordPolicy: length(12) and maxLength(128) and notUsername and notEmail and passwordHistory(3)

# Tras 10 fallos seguidos la cuenta espera, cada vez más (hasta 15 min); nunca queda bloqueada para siempre.
bruteForceProtected: true
permanentLockout: false
failureFactor: 10
waitIncrementSeconds: 60
maxFailureWaitSeconds: 900
maxDeltaTimeSeconds: 43200
quickLoginCheckMilliSeconds: 1000
minimumQuickLoginWaitSeconds: 60

# Sesiones como en Google: un día sin uso, o un mes con «Recordarme»; el token de acceso dura 5 min y cada
# refresh token sirve una sola vez.
accessTokenLifespan: 300
ssoSessionIdleTimeout: 86400
ssoSessionMaxLifespan: 864000
ssoSessionIdleTimeoutRememberMe: 2592000
ssoSessionMaxLifespanRememberMe: 7776000
revokeRefreshToken: true
refreshTokenMaxReuse: 0
# Los enlaces de verificar el correo y crear una contraseña nueva valen 30 min (Keycloak trae 5: poco para quien mira
# el correo más tarde).
actionTokenGeneratedByUserLifespan: 1800

# Lo que hace cada cuenta (entradas, cambios, fallos) y cada administrador, 90 días: de aquí sale la actividad
# reciente de la cuenta y la auditoría.
eventsEnabled: true
eventsExpiration: 7776000
# «email» avisa por correo de los cambios de seguridad (contraseña, dos pasos, passkeys); los fallos de entrada no
# se avisan uno por uno (KC_SPI_EVENTS_LISTENER__EMAIL__EXCLUDE_EVENTS en el arranque).
eventsListeners: [jboss-logging, email]
adminEventsEnabled: true
adminEventsDetailsEnabled: true
# Sin esto los de administración no caducan, y guardan copias del perfil después de borrar la cuenta.
attributes:
  adminEventsExpiration: "7776000"

# Passkeys: se ofrecen en el mismo formulario del correo. El RP ID es el dominio de la empresa, así una passkey
# vale en auth. y en accounts. aunque el producto viva en otro dominio.
webAuthnPolicyPasswordlessRpEntityName: $(env:BRAND_NAME)
webAuthnPolicyPasswordlessRpId: $(env:PASSKEY_RP_ID)
webAuthnPolicyPasswordlessPasskeysEnabled: true
webAuthnPolicyRpEntityName: $(env:BRAND_NAME)
webAuthnPolicyRpId: $(env:PASSKEY_RP_ID)

# El correo de verificar y recuperar sale de aquí, con el nombre de la marca.
smtpServer:
  host: $(env:SMTP_HOST)
  port: $(env:SMTP_PORT)
  from: $(env:SMTP_FROM)
  fromDisplayName: $(env:BRAND_NAME)
  starttls: $(env:SMTP_STARTTLS)
  auth: $(env:SMTP_AUTH)
  user: $(env:SMTP_USER)
  password: $(env:SMTP_PASSWORD)

authenticatorConfig:
  - alias: identifier first - conditional credential
    config:
      credentials: webauthn-passwordless

# Cambiar el correo (verificando el nuevo) y borrar la cuenta se lanzan desde la Cuenta como acciones.
requiredActions:
  - alias: UPDATE_EMAIL
    name: Update Email
    providerId: UPDATE_EMAIL
    enabled: true
    defaultAction: false
  - alias: delete_account
    name: Delete Account
    providerId: delete_account
    enabled: true
    defaultAction: false
  # Activar los dos pasos por correo (providers/ConfigureEmailCode.java): la Cuenta lo lanza con
  # kc_action=fc-configure-email-code.
  - alias: fc-configure-email-code
    name: Configure email codes
    providerId: fc-configure-email-code
    enabled: true
    defaultAction: false

# Entrar como en Adobe: primero el correo y después cómo entra esa cuenta (contraseña, o la passkey que el navegador ya
# ofrece al escribir el correo). Es el «browser» de Keycloak con el paso del correo (providers/EmailFirstForm.java, su
# «Username Form» más un aviso para las cuentas sin contraseña) y «Password Form» en lugar del formulario de los dos
# juntos; los dos pasos y la cookie de sesión siguen igual.
browserFlow: browser identifier first
# Recuperar la contraseña es el de Keycloak más un paso (providers/): abrir el enlace verifica el correo. Así quien se
# registró y no abrió el primer enlace (el registro no pide contraseña; llega tras verificar) entra con un solo correo.
resetCredentialsFlow: reset credentials verify email
authenticationFlows:
  - alias: browser identifier first
    description: Keycloak's browser flow, asking for the email first and then for the password
    providerId: basic-flow
    topLevel: true
    builtIn: false
    authenticationExecutions:
      - authenticator: auth-cookie
        requirement: ALTERNATIVE
        priority: 10
        authenticatorFlow: false
        userSetupAllowed: false
      - authenticator: identity-provider-redirector
        requirement: ALTERNATIVE
        priority: 25
        authenticatorFlow: false
        userSetupAllowed: false
      - flowAlias: identifier first - forms
        requirement: ALTERNATIVE
        priority: 30
        authenticatorFlow: true
        userSetupAllowed: false
  - alias: identifier first - forms
    description: The email, then the password or an email code (skipped after a passkey), then two-step verification if set up
    providerId: basic-flow
    topLevel: false
    builtIn: false
    authenticationExecutions:
      # El «Username Form» de Keycloak más un aviso para las cuentas sin contraseña (providers/EmailFirstForm.java).
      - authenticator: email-first-form
        requirement: REQUIRED
        priority: 10
        authenticatorFlow: false
        userSetupAllowed: false
      - flowAlias: identifier first - password or code
        requirement: REQUIRED
        priority: 20
        authenticatorFlow: true
        userSetupAllowed: false
      - flowAlias: identifier first - conditional 2fa
        requirement: CONDITIONAL
        priority: 30
        authenticatorFlow: true
        userSetupAllowed: false
  # Como en Adobe: la contraseña o un código por correo (providers/EmailCodeLoginForm.java). Quien tiene contraseña la ve
  # primero y elige el código desde su página; quien no tiene, recibe el código directamente.
  - alias: identifier first - password or code
    description: The password, or a one-time code sent to the email
    providerId: basic-flow
    topLevel: false
    builtIn: false
    authenticationExecutions:
      - authenticator: auth-password-form
        requirement: ALTERNATIVE
        priority: 10
        authenticatorFlow: false
        userSetupAllowed: false
      - authenticator: fc-email-code
        requirement: ALTERNATIVE
        priority: 20
        authenticatorFlow: false
        userSetupAllowed: false
  - alias: identifier first - conditional 2fa
    description: The code from the app or the email, unless the account has none or entered with a passkey
    providerId: basic-flow
    topLevel: false
    builtIn: false
    authenticationExecutions:
      - authenticator: conditional-user-configured
        requirement: REQUIRED
        priority: 10
        authenticatorFlow: false
        userSetupAllowed: false
      # Como en el «browser» de Keycloak: quien entró con una passkey no pasa por los dos pasos.
      - authenticator: conditional-credential
        authenticatorConfig: identifier first - conditional credential
        requirement: REQUIRED
        priority: 20
        authenticatorFlow: false
        userSetupAllowed: false
      - authenticator: auth-otp-form
        requirement: ALTERNATIVE
        priority: 30
        authenticatorFlow: false
        userSetupAllowed: false
      # El código por correo como segundo paso, para quien lo activó (providers/EmailCodeSecondFactor.java).
      - authenticator: fc-email-code-2fa
        requirement: ALTERNATIVE
        priority: 40
        authenticatorFlow: false
        userSetupAllowed: false
  - alias: reset credentials verify email
    description: Keycloak's reset credentials, where opening the reset link also verifies the email
    providerId: basic-flow
    topLevel: true
    builtIn: false
    authenticationExecutions:
      - authenticator: reset-credentials-choose-user
        requirement: REQUIRED
        priority: 10
        authenticatorFlow: false
        userSetupAllowed: false
      - authenticator: reset-credential-email
        requirement: REQUIRED
        priority: 20
        authenticatorFlow: false
        userSetupAllowed: false
      - authenticator: reset-link-verifies-email
        requirement: REQUIRED
        priority: 25
        authenticatorFlow: false
        userSetupAllowed: false
      - authenticator: reset-password
        requirement: REQUIRED
        priority: 30
        authenticatorFlow: false
        userSetupAllowed: false
      - flowAlias: reset verify email - conditional otp
        requirement: CONDITIONAL
        priority: 40
        authenticatorFlow: true
        userSetupAllowed: false
  - alias: reset verify email - conditional otp
    description: Resets the OTP when the account has one
    providerId: basic-flow
    topLevel: false
    builtIn: false
    authenticationExecutions:
      - authenticator: conditional-user-configured
        requirement: REQUIRED
        priority: 10
        authenticatorFlow: false
        userSetupAllowed: false
      - authenticator: reset-otp
        requirement: REQUIRED
        priority: 20
        authenticatorFlow: false
        userSetupAllowed: false

# Entrar con Google, Facebook o GitHub. Las credenciales van en .env; scripts/apply.sh apaga el proveedor que no
# tiene CLIENT_ID, y su botón no sale. En la consola de cada uno, la redirección autorizada es
# $KC_URL/realms/$REALM/broker/<alias>/endpoint. Sólo el correo que llega de Google se da por verificado.
identityProviders:
  - alias: google
    providerId: google
    displayName: Google
    enabled: $(env:GOOGLE_ENABLED)
    trustEmail: true
    config:
      clientId: $(env:GOOGLE_CLIENT_ID:-)
      clientSecret: $(env:GOOGLE_CLIENT_SECRET:-)
      syncMode: IMPORT
  - alias: facebook
    providerId: facebook
    displayName: Facebook
    enabled: $(env:FACEBOOK_ENABLED)
    trustEmail: false
    config:
      clientId: $(env:FACEBOOK_CLIENT_ID:-)
      clientSecret: $(env:FACEBOOK_CLIENT_SECRET:-)
      syncMode: IMPORT
  - alias: github
    providerId: github
    displayName: GitHub
    enabled: $(env:GITHUB_ENABLED)
    trustEmail: false
    config:
      clientId: $(env:GITHUB_CLIENT_ID:-)
      clientSecret: $(env:GITHUB_CLIENT_SECRET:-)
      syncMode: IMPORT

roles:
  realm:
    - name: default-roles-$(env:REALM)
      composite: true
      composites:
        realm: [offline_access, uma_authorization]
        client:
          account: [view-profile, manage-account, delete-account]
