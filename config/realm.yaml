# El realm de todas las cuentas de la empresa. Las variables salen del entorno; ver .env.example.
realm: $(env:REALM)
enabled: true
displayName: $(env:BRAND_NAME)

# Cualquiera crea su cuenta, entra con el correo y lo verifica antes de usarla.
registrationAllowed: true
registrationEmailAsUsername: true
loginWithEmailAllowed: true
duplicateEmailsAllowed: false
editUsernameAllowed: false
verifyEmail: true
resetPasswordAllowed: true
rememberMe: true

# Las pantallas de acceso y los correos con la identidad de la Cuenta (themes/fretchcop).
loginTheme: fretchcop
emailTheme: fretchcop

internationalizationEnabled: true
supportedLocales: [es, en]
defaultLocale: es
sslRequired: external

# Contraseñas largas antes que raras (NIST 800-63B); el hash es Argon2, el de Keycloak por defecto.
passwordPolicy: length(12) and maxLength(128) and notUsername and notEmail and passwordHistory(3)

# Tras 10 fallos seguidos la cuenta espera, cada vez más (hasta 15 min); nunca queda bloqueada para siempre.
bruteForceProtected: true
permanentLockout: false
failureFactor: 10
waitIncrementSeconds: 60
maxFailureWaitSeconds: 900
maxDeltaTimeSeconds: 43200
quickLoginCheckMilliSeconds: 1000
minimumQuickLoginWaitSeconds: 60

# Sesiones como en Google: un día sin uso, o un mes con «Recordarme»; el token de acceso dura 5 min y cada
# refresh token sirve una sola vez.
accessTokenLifespan: 300
ssoSessionIdleTimeout: 86400
ssoSessionMaxLifespan: 864000
ssoSessionIdleTimeoutRememberMe: 2592000
ssoSessionMaxLifespanRememberMe: 7776000
revokeRefreshToken: true
refreshTokenMaxReuse: 0
# Los enlaces de verificar el correo y crear una contraseña nueva valen 30 min (Keycloak trae 5: poco para quien mira
# el correo más tarde).
actionTokenGeneratedByUserLifespan: 1800

# Lo que hace cada cuenta (entradas, cambios, fallos) y cada administrador, 90 días: de aquí sale la actividad
# reciente de la cuenta y la auditoría.
eventsEnabled: true
eventsExpiration: 7776000
# «email» avisa por correo de los cambios de seguridad (contraseña, dos pasos, passkeys); los fallos de entrada no
# se avisan uno por uno (KC_SPI_EVENTS_LISTENER__EMAIL__EXCLUDE_EVENTS en el arranque).
eventsListeners: [jboss-logging, email]
adminEventsEnabled: true
adminEventsDetailsEnabled: true
# Sin esto los de administración no caducan, y guardan copias del perfil después de borrar la cuenta.
attributes:
  adminEventsExpiration: "7776000"

# Passkeys: se ofrecen en el mismo formulario del correo. El RP ID es el dominio de la empresa, así una passkey
# vale en auth. y en accounts. aunque el producto viva en otro dominio.
webAuthnPolicyPasswordlessRpEntityName: $(env:BRAND_NAME)
webAuthnPolicyPasswordlessRpId: $(env:PASSKEY_RP_ID)
webAuthnPolicyPasswordlessPasskeysEnabled: true
webAuthnPolicyRpEntityName: $(env:BRAND_NAME)
webAuthnPolicyRpId: $(env:PASSKEY_RP_ID)

# El correo de verificar y recuperar sale de aquí, con el nombre de la marca.
smtpServer:
  host: $(env:SMTP_HOST)
  port: $(env:SMTP_PORT)
  from: $(env:SMTP_FROM)
  fromDisplayName: $(env:BRAND_NAME)
  starttls: $(env:SMTP_STARTTLS)
  auth: $(env:SMTP_AUTH)
  user: $(env:SMTP_USER)
  password: $(env:SMTP_PASSWORD)

# Cambiar el correo (verificando el nuevo) y borrar la cuenta se lanzan desde la Cuenta como acciones.
requiredActions:
  - alias: UPDATE_EMAIL
    name: Update Email
    providerId: UPDATE_EMAIL
    enabled: true
    defaultAction: false
  - alias: delete_account
    name: Delete Account
    providerId: delete_account
    enabled: true
    defaultAction: false

# Recuperar la contraseña es el de Keycloak más un paso (providers/): abrir el enlace verifica el correo. Así quien se
# registró y no abrió el primer enlace (el registro no pide contraseña; llega tras verificar) entra con un solo correo.
resetCredentialsFlow: reset credentials verify email
authenticationFlows:
  - alias: reset credentials verify email
    description: Keycloak's reset credentials, where opening the reset link also verifies the email
    providerId: basic-flow
    topLevel: true
    builtIn: false
    authenticationExecutions:
      - authenticator: reset-credentials-choose-user
        requirement: REQUIRED
        priority: 10
        authenticatorFlow: false
        userSetupAllowed: false
      - authenticator: reset-credential-email
        requirement: REQUIRED
        priority: 20
        authenticatorFlow: false
        userSetupAllowed: false
      - authenticator: reset-link-verifies-email
        requirement: REQUIRED
        priority: 25
        authenticatorFlow: false
        userSetupAllowed: false
      - authenticator: reset-password
        requirement: REQUIRED
        priority: 30
        authenticatorFlow: false
        userSetupAllowed: false
      - flowAlias: reset verify email - conditional otp
        requirement: CONDITIONAL
        priority: 40
        authenticatorFlow: true
        userSetupAllowed: false
  - alias: reset verify email - conditional otp
    description: Resets the OTP when the account has one
    providerId: basic-flow
    topLevel: false
    builtIn: false
    authenticationExecutions:
      - authenticator: conditional-user-configured
        requirement: REQUIRED
        priority: 10
        authenticatorFlow: false
        userSetupAllowed: false
      - authenticator: reset-otp
        requirement: REQUIRED
        priority: 20
        authenticatorFlow: false
        userSetupAllowed: false

roles:
  realm:
    - name: default-roles-$(env:REALM)
      composite: true
      composites:
        realm: [offline_access, uma_authorization]
        client:
          account: [view-profile, manage-account, delete-account]
